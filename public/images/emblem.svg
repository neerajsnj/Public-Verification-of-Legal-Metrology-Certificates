<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="60" height="72">
  <!-- Stylized Government Emblem Motif -->
  <g fill="#0B2545">
    <!-- Top Lions representation -->
    <path d="M 50 15 C 44 15 42 22 42 28 C 42 34 46 38 50 40 C 54 38 58 34 58 28 C 58 22 56 15 50 15 Z" fill="#0B2545"/>
    <path d="M 34 22 C 30 22 28 28 28 34 C 28 40 32 44 36 46 C 39 42 41 36 41 30 C 41 26 38 22 34 22 Z" fill="#133E87"/>
    <path d="M 66 22 C 70 22 72 28 72 34 C 72 40 68 44 64 46 C 61 42 59 36 59 30 C 59 26 62 22 66 22 Z" fill="#133E87"/>
    
    <!-- Abacus / Capital Base -->
    <rect x="22" y="52" width="56" height="8" rx="2" fill="#0B2545"/>
    
    <!-- Ashoka Chakra (Dharma Wheel) in Center -->
    <circle cx="50" cy="72" r="14" fill="none" stroke="#000080" stroke-width="2.5"/>
    <circle cx="50" cy="72" r="3" fill="#000080"/>
    <!-- Spokes -->
    <line x1="50" y1="58" x2="50" y2="86" stroke="#000080" stroke-width="1.2"/>
    <line x1="36" y1="72" x2="64" y2="72" stroke="#000080" stroke-width="1.2"/>
    <line x1="40" y1="62" x2="60" y2="82" stroke="#000080" stroke-width="1.2"/>
    <line x1="40" y1="82" x2="60" y2="62" stroke="#000080" stroke-width="1.2"/>
    <line x1="43" y1="59" x2="57" y2="85" stroke="#000080" stroke-width="1"/>
    <line x1="57" y1="59" x2="43" y2="85" stroke="#000080" stroke-width="1"/>
    <line x1="37" y1="66" x2="63" y2="78" stroke="#000080" stroke-width="1"/>
    <line x1="37" y1="78" x2="63" y2="66" stroke="#000080" stroke-width="1"/>

    <!-- Pedestal Base -->
    <rect x="18" y="90" width="64" height="6" rx="1.5" fill="#0B2545"/>
    <rect x="14" y="98" width="72" height="4" rx="1" fill="#FF9933"/>

    <!-- Satyameva Jayate Banner Text -->
    <text x="50" y="114" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#0B2545" text-anchor="middle" letter-spacing="1">
      सत्यमेव जयते
    </text>
  </g>
</svg>
